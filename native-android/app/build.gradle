plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningReady = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def ciVersionCode = System.getenv('MOURA_VERSION_CODE')
def ciVersionName = System.getenv('MOURA_VERSION_NAME')
def nativeRevision = System.getenv('MOURA_NATIVE_REVISION') ?: '3'

android {
    namespace 'com.moura.downloads'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.moura.downloads'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 4
        versionName ciVersionName ?: '4.0.0'
        buildConfigField 'int', 'NATIVE_REVISION', nativeRevision
        buildConfigField 'int', 'PACKAGED_CONTENT_VERSION',
                ciVersionCode ? ciVersionCode : '4'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    flavorDimensions 'distribution'
    productFlavors {
        sideload {
            dimension 'distribution'
            buildConfigField 'boolean', 'PLAY_STORE_BUILD', 'false'
        }
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'PLAY_STORE_BUILD', 'true'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-session:1.9.4'
    implementation 'androidx.media3:media3-ui:1.9.4'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
