name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar APK instalável
        working-directory: native-android
        run: gradle assembleDebug --stacktrace

      - name: Preparar pacote para Netlify
        run: |
          mkdir -p app/apk
          cp native-android/app/build/outputs/apk/debug/app-debug.apk app/apk/moura-downloads.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Moura-Downloads-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar pacote pronto para Netlify
        uses: actions/upload-artifact@v4
        with:
          name: Moura-Downloads-Netlify
          path: app
          if-no-files-found: error
