name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar assinatura permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moura-release.jks"
          test -s "$RUNNER_TEMP/moura-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/moura-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Gerar APKs assinados
        working-directory: native-android
        run: gradle assembleRelease --stacktrace

      - name: Preparar APKs e atualização automática
        run: |
          mkdir -p release
          cp native-android/app/build/outputs/apk/release/app-universal-release.apk release/moura-downloads.apk
          cp native-android/app/build/outputs/apk/release/app-arm64-v8a-release.apk release/moura-downloads-arm64.apk
          cp native-android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk release/moura-downloads-32bit.apk
          test -s release/moura-downloads.apk
          test -s release/moura-downloads-arm64.apk
          test -s release/moura-downloads-32bit.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt
          python3 scripts/generate-update-manifest.py

      - name: Verificar assinatura dos APKs
        run: |
          for apk in release/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Guardar APKs nos artefatos da execução
        uses: actions/upload-artifact@v4
        with:
          name: Moura-Downloads-APK
          path: release
          if-no-files-found: error

      - name: Publicar APKs nos endereços fixos de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/* --clobber
            gh release edit latest \
              --title "Moura Downloads 4.0 — Atualizações inteligentes" \
              --notes "Atualização dentro do app, assinatura permanente, download automático no Wi-Fi, repetição pelo histórico e experiência simplificada. Use moura-downloads-arm64.apk em celulares atuais. Commit: $GITHUB_SHA"
          else
            gh release create latest release/* \
              --target "$GITHUB_SHA" \
              --title "Moura Downloads 4.0 — Atualizações inteligentes" \
              --notes "Atualização dentro do app, assinatura permanente, download automático no Wi-Fi, repetição pelo histórico e experiência simplificada. Use moura-downloads-arm64.apk em celulares atuais. Commit: $GITHUB_SHA"
          fi
