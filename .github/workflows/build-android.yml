name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOURA_VERSION_CODE: ${{ github.run_number }}
      MOURA_VERSION_NAME: 4.0.${{ github.run_number }}
      MOURA_NATIVE_REVISION: 8
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Validar projeto antes do build
        run: |
          python3 scripts/validate-project.py
          node --check app/app.js
          node --check app/cloud.js
          node --check app/i18n.js
          node --check app/sw.js

      - name: Configurar assinatura permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moura-release.jks"
          test -s "$RUNNER_TEMP/moura-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/moura-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Gerar APKs e pacote da Play Store assinados
        working-directory: native-android
        run: gradle assembleSideloadRelease bundlePlayRelease --stacktrace

      - name: Confirmar manifesto oficial da Google Play
        run: python3 scripts/validate-play-manifest.py

      - name: Preparar APKs, Play Store e atualização automática
        run: |
          mkdir -p release
          cp native-android/app/build/outputs/apk/sideload/release/app-sideload-universal-release.apk release/moura-downloads.apk
          cp native-android/app/build/outputs/apk/sideload/release/app-sideload-arm64-v8a-release.apk release/moura-downloads-arm64.apk
          cp native-android/app/build/outputs/apk/sideload/release/app-sideload-armeabi-v7a-release.apk release/moura-downloads-32bit.apk
          cp native-android/app/build/outputs/bundle/playRelease/app-play-release.aab release/moura-downloads-play-store.aab
          test -s release/moura-downloads.apk
          test -s release/moura-downloads-arm64.apk
          test -s release/moura-downloads-32bit.apk
          test -s release/moura-downloads-play-store.aab
          python3 scripts/generate-update-manifest.py
          sha256sum release/*.apk release/*.aab release/*.zip release/update.json > release/SHA256SUMS.txt
          ls -lh release

      - name: Verificar tamanho e arquiteturas dos APKs
        run: python3 scripts/validate-release.py

      - name: Verificar assinatura dos APKs
        run: |
          expected_certificate="$(tr -d '\r\n ' < scripts/expected-signing-certificate.sha256)"
          for apk in release/*.apk; do
            certificate="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
            test -n "$certificate"
            test "$certificate" = "$expected_certificate"
            echo "$(basename "$apk"): assinatura permanente confirmada"
          done

      - name: Guardar instaladores nos artefatos da execução
        uses: actions/upload-artifact@v7
        with:
          name: Moura-Downloads-Android
          path: release
          if-no-files-found: error
          compression-level: 0

      - name: Publicar APKs nos endereços fixos de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/* --clobber
            gh release edit latest \
              --title "Moura Downloads 4.0 — Super App" \
              --notes "App completo desenvolvido por Leandro Moura. Esta versão transforma o Estúdio Moura em um editor profissional com linha do tempo por cena, duração individual, transições, Full HD, movimento cinematográfico e sincronização automática com as batidas da música. No site, use moura-downloads.apk. Commit: $GITHUB_SHA"
          else
            gh release create latest release/* \
              --target "$GITHUB_SHA" \
              --title "Moura Downloads 4.0 — Super App" \
              --notes "App completo desenvolvido por Leandro Moura. Esta versão transforma o Estúdio Moura em um editor profissional com linha do tempo por cena, duração individual, transições, Full HD, movimento cinematográfico e sincronização automática com as batidas da música. No site, use moura-downloads.apk. Commit: $GITHUB_SHA"
          fi
