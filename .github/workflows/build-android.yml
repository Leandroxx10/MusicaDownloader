name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar APK instalável
        working-directory: native-android
        run: gradle assembleDebug --stacktrace

      - name: Preparar APK para distribuição
        run: |
          mkdir -p release
          cp native-android/app/build/outputs/apk/debug/app-universal-debug.apk release/moura-downloads.apk
          cp native-android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release/moura-downloads-arm64.apk
          cp native-android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk release/moura-downloads-32bit.apk
          test -s release/moura-downloads.apk
          test -s release/moura-downloads-arm64.apk
          test -s release/moura-downloads-32bit.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Guardar APKs nos artefatos da execução
        uses: actions/upload-artifact@v4
        with:
          name: Moura-Downloads-APK
          path: release
          if-no-files-found: error

      - name: Publicar APKs nos endereços fixos de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/* --clobber
            gh release edit latest \
              --title "Moura Downloads 3.0 — Super App" \
              --notes "Player interno, QR Code, modo rápido e APKs menores por arquitetura. Use moura-downloads-arm64.apk em celulares atuais ou moura-downloads.apk para compatibilidade universal. Commit: $GITHUB_SHA"
          else
            gh release create latest release/* \
              --target "$GITHUB_SHA" \
              --title "Moura Downloads 3.0 — Super App" \
              --notes "Player interno, QR Code, modo rápido e APKs menores por arquitetura. Use moura-downloads-arm64.apk em celulares atuais ou moura-downloads.apk para compatibilidade universal. Commit: $GITHUB_SHA"
          fi
